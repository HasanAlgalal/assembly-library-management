name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install assembler
        run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - name: Assemble, link and test
        run: make test
